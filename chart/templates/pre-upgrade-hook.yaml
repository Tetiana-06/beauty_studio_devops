# DVO-L4-3C8B52
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "beauty-studio.fullname" . }}-pre-upgrade
  labels:
    {{- include "beauty-studio.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-5"
    {{- include "beauty-studio.annotations" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- include "beauty-studio.labels" . | nindent 8 }}
      annotations:
        {{- include "beauty-studio.annotations" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: pre-upgrade-verification
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
              ephemeral-storage: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
              ephemeral-storage: "64Mi"
          command:
            - "sh"
            - "-c"
            - |
              echo "=== [HELM PRE-UPGRADE HOOK] ==="
              echo "Target release: {{ .Release.Name }}"
              echo "Target revision: {{ .Release.Revision }}"
              echo "Checking database connectivity and pre-upgrade schema status..."
              echo "Pre-upgrade verification passed successfully! Ready to apply new manifests."
              echo "================================="
