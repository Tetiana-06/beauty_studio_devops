# DVO-L4-3C8B52
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "beauty-studio.fullname" . }}-test-connection
  labels:
    {{- include "beauty-studio.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- include "beauty-studio.annotations" . | nindent 4 }}
spec:
  restartPolicy: Never
  containers:
    - name: wget-test
      image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
      imagePullPolicy: {{ .Values.database.image.pullPolicy }}
      command:
        - "sh"
        - "-c"
        - |
          echo "=== [HELM RELEASE TEST] ==="
          echo "Testing backend connectivity at: {{ include "beauty-studio.fullname" . }}-backend:{{ .Values.backend.service.port }}/health"
          for i in $(seq 1 15); do
            if wget -q -O - http://{{ include "beauty-studio.fullname" . }}-backend:{{ .Values.backend.service.port }}/health; then
              echo ""
              echo "=== Backend test succeeded! Application is healthy. ==="
              exit 0
            fi
            echo "Waiting for backend to become ready... ($i/15)"
            sleep 2
          done
          echo "Backend failed health check after retries"
          exit 1
