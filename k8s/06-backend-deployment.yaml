# DVO-L3-7F2A91
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: beauty-studio
  labels:
    app: backend
    student: tetiana
  annotations:
    devops-lab/mascot-approved: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        student: tetiana
      annotations:
        devops-lab/mascot-approved: "true"
    spec:
      containers:
        - name: backend
          image: beauty-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
