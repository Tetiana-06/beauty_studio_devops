# DVO-L3-7F2A91
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: beauty-studio
  labels:
    app: frontend
    student: tetiana
  annotations:
    devops-lab/mascot-approved: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        student: tetiana
      annotations:
        devops-lab/mascot-approved: "true"
    spec:
      containers:
        - name: frontend
          image: beauty-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
