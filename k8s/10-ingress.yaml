# DVO-L3-7F2A91
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beauty-ingress
  namespace: beauty-studio
  labels:
    student: tetiana
  annotations:
    devops-lab/mascot-approved: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
